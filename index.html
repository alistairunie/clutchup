function setPlaysSeg(k){
  S.playsSeg = k; LS.set("playsSeg", k);
  if (k === "ladder" && (!S.ladder || Date.now() - S.ladderAt > 5 * 60e3)) loadLadder(false);
  renderLadder(); window.scrollTo(0, 0);
}
function ladderCard(){
  const L = S.state && S.state.ladder;
  if (!FEAT().slips || !L) return "";
  const bal = +L.balance || 0, start = +L.start || 10, target = +L.target || 100;
  const prog = Math.max(0, Math.min(100, Math.log(Math.max(bal, start) / start) / Math.log(target / start) * 100));
  const run = L.slip ? (S.state.slips || []).find(s => s.id === L.slip) : null;
  const status = run ? "Step " + (L.step + 1) + " is on" : L.step ? L.step + (L.step === 1 ? " step" : " steps") + " won this run" : "Ready for step 1";
  let h = '<div class="card"><div class="row"><div class="grow"><div class="small muted">Your ladder</div><span class="big2">' + money(bal) + '</span><div class="small muted">' + status + ' · target ' + money(target) + '</div></div>' +
    '<div class="small muted" style="text-align:right">' + (L.total_runs ? L.total_runs + (L.total_runs === 1 ? " run" : " runs") + '<br>' + (L.targets_hit || 0) + ' hit the target' : 'Each run starts<br>on ' + money(start)) + '</div></div>';
  h += '<div class="prog"><i style="width:' + prog.toFixed(0) + '%"></i></div>';
  if (run){
    h += '<div class="small" style="margin-top:8px">' + run.legs.map(l => legMark(l.state) + ' ' + esc((l.short || l.name) + " " + l.label) + (l.progress && !l.state ? ' <span class="muted">(' + esc(l.progress) + ')</span>' : '')).join("<br>") +
      '<div class="muted" style="margin-top:3px">' + money(run.stake) + ' @ ' + (+run.price).toFixed(2) + ' returns ' + money(run.returns) + '</div></div>';
  } else if (L.next){
    S.lplays.next = L.next;
    h += '<div style="margin-top:8px"><div class="small muted">Next step it found for you</div><div style="font-weight:600">' + esc(playTitle(L.next)) + ' <span class="price">' + money(L.next.price) + '</span></div><div class="small muted">' + pct(L.next.p) + ' chance · ' + esc(startText(L.next.start)) + '</div>' + trackBtn(L.next, "next") + '</div>';
  }
  const armed = S.armed === "ladder";
  h += '<div class="row" style="gap:7px;margin-top:10px"><button class="btn small" id="ledit">' + (S.ledit ? "Done" : "Start and target") + '</button><button class="btn small" id="lreset"' + (armed ? ' style="color:var(--red)"' : '') + '>' + (armed ? "Tap again to start over" : "Start over") + '</button></div>';
  if (S.ledit) h += '<div class="rule" style="margin-top:8px"><span>Each run starts on</span><span class="row" style="gap:6px"><span class="muted">$</span><input id="lstart" type="number" inputmode="decimal" step="1" value="' + start + '"></span></div>' +
    '<div class="rule"><span>Target</span><span class="row" style="gap:6px"><span class="muted">$</span><input id="ltarget" type="number" inputmode="decimal" step="10" value="' + target + '"></span></div><button class="btn small primary" id="lsave" style="margin-top:6px">Save</button>';
  return h + '</div>';
}
function bindLadderCard(){
  const e = $("ledit"); if (e) e.onclick = () => { S.ledit = !S.ledit; renderLadder(); };
  const r = $("lreset");
  if (r) r.onclick = async () => {
    if (S.armed !== "ladder"){ S.armed = "ladder"; clearTimeout(S.armTimer); S.armTimer = setTimeout(() => { S.armed = null; renderLadder(); }, 4000); renderLadder(); return; }
    S.armed = null; await api("/api/ladder/state", {reset:true}); await loadState(); renderLadder();
  };
  const sv = $("lsave");
  if (sv) sv.onclick = async () => {
    const start = parseFloat($("lstart").value), target = parseFloat($("ltarget").value);
    if (!(start >= 1) || !(target > start)) { sv.textContent = "Target needs to be above the start"; return; }
    await api("/api/ladder/state", {start, target}); S.ledit = false; await loadState(); renderLadder();
  };
}

function scrQuery(){ const q = S.scrQ; return Object.keys(q).filter(k => q[k] !== "" && q[k] != null).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(q[k])).join("&"); }
async function loadScreener(force){
  if (S.scrLoading) { S.scrAgain = true; return; }
  S.scrLoading = true; S.scrErr = "";
  if (S.tab === "ladder" && S.playsSeg === "screener") renderLadder();
  try{ S.scr = await api("/api/screener?" + scrQuery() + (force ? "&refresh=1" : "")); S.scrAt = Date.now(); }
  catch(e){ S.scrErr = e.message; }
  S.scrLoading = false;
  if (S.scrAgain){ S.scrAgain = false; return loadScreener(false); }
  if (S.tab === "ladder" && S.playsSeg === "screener") renderLadder();
}
function formLine(r){
  const f = r.form || {};
  if (!f.l10n) return "No recent games to go on";
  return '<b style="color:var(--text)">' + f.l10 + '/' + f.l10n + '</b> last 10 · ' + f.l5 + '/' + f.l5n + ' last 5' + (r.yesno ? '' : ' · avg ' + fmt(f.avg10) + ' (last 5: ' + fmt(f.avg5) + ')');
}
function scrRow(r, i){
  const open = S.scrOpen === i;
  let h = '<div class="card scr" data-sr="' + i + '"><div class="l1"><span>' + esc(r.name) + ' <span class="muted small">' + esc(r.team) + '</span>' + injBadge(r.injury) + '</span><span class="price">' + money(r.price) + '</span></div>' +
    '<div class="l2">' + esc(r.label) + '</div><div class="l3">' + formLine(r) + '</div>' +
    '<div class="l3">' + esc(r.matchup) + ' · ' + esc(startText(r.start)) + ' · ' + esc(r.league_short) + (r.fair ? ' · fair ' + money(r.fair) : '') + (r.edge > 0.005 ? ' · <span class="pos">+' + Math.round(r.edge * 100) + '% edge</span>' : '') + '</div>';
  if (open){
    if (r.matchup_text) h += '<div class="l3" style="margin-top:4px">' + esc(r.matchup_text) + '</div>';
    if (r.injury_note) h += '<div class="l3">' + esc(r.injury + ": " + r.injury_note) + '</div>';
    h += '<div class="row" style="gap:7px;margin-top:8px">' + (legTracked(r) ? '<button class="btn small" disabled>Tracking</button>' : '<button class="btn small primary" data-strack="' + i + '">Track it</button>') +
      (HOOK() ? '<button class="btn small" data-spost2="' + i + '">Post</button>' : '') + '<button class="btn small" data-sgame="' + i + '">Open game</button></div>';
  }
  return h + '</div>';
}
function pickBody(r, source){
  return {game_id:r.game_id, athlete_id:r.athlete_id, name:r.name, team:r.team, stat:r.stat, side:r.side, line:r.line,
          odds:source === "pickem" ? null : r.price, source, alerts:(r.stat === "HWIN" || r.stat === "AWIN") ? "key" : "all"};
}
function renderScreener(el){
  const top = playsTop(), q = S.scrQ, R = S.scr;
  if (!R && !S.scrLoading && !S.scrErr) loadScreener(false);
  const opt = (v, l, cur) => '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? " selected" : "") + '>' + esc(l) + '</option>';
  let h = top + '<div class="filters">' +
    '<select id="fq_league">' + opt("", "All leagues", q.league) + ((R && R.leagues) || []).map(l => opt(l.key, l.name, q.league)).join("") + '</select>' +
    '<select id="fq_prop">' + opt("", "All stats", q.prop) + ((R && R.props) || []).map(p => opt(p.key, p.name, q.prop)).join("") + '</select>' +
    '<select id="fq_side">' + opt("", "Overs and unders", q.side) + opt("more", "Overs", q.side) + opt("less", "Unders", q.side) + '</select>' +
    '<select id="fq_min_hit">' + [50, 60, 70, 80, 90, 100].map(v => opt(v, "Hit " + v + "%+ of last 10", q.min_hit)).join("") + '</select>' +
    '<select id="fq_sort">' + opt("hit", "Best hit rate", q.sort) + opt("edge", "Biggest edge", q.sort) + opt("chance", "Best chance", q.sort) + opt("price", "Longest price", q.sort) + '</select>' +
    '<span class="row small muted" style="gap:5px">$<input id="fq_price_min" type="number" step="0.05" inputmode="decimal" value="' + q.price_min + '">to $<input id="fq_price_max" type="number" step="0.05" inputmode="decimal" value="' + q.price_max + '"></span></div>' +
    '<div class="fchips"><button data-fq="avg" class="' + (q.avg === "1" ? "on" : "") + '">Average past the line</button><button data-fq="main" class="' + (q.main === "1" ? "on" : "") + '">Main lines only</button><button data-fq="inj" class="' + (q.inj === "1" ? "on" : "") + '">Hide injured</button></div>';
  if (!R){
    h += S.scrErr ? '<div class="empty"><b>Couldn\'t load props</b>' + esc(S.scrErr) + '</div><button class="btn block" id="scretry">Try again</button>'
      : '<div class="spin"></div><div class="empty" style="padding-top:0">Checking every prop and each player\'s last 10 games.<br>The first look can take up to a minute.</div>';
  } else {
    h += '<div class="gamehead" style="margin-top:2px"><span class="small muted">' + R.total + (R.total === 1 ? " prop fits" : " props fit") + (R.total > R.rows.length ? ", top " + R.rows.length + " shown" : "") + ' · checked ' + esc(clockText(R.updated)) + '</span><button class="btn small" id="scref"' + (S.scrLoading ? " disabled" : "") + '>' + (S.scrLoading ? "Checking..." : "Refresh") + '</button></div>';
    if (!R.rows.length) h += '<div class="empty"><b>Nothing fits those filters</b>Try a lower hit rate or a wider price range.</div>';
    if (R.rows.length) h += '<div class="list">' + R.rows.map(scrRow).join("") + '</div>';
    h += '<div class="card small muted">Hit rate and averages are from each player\'s last 10 games. Prices are ' + esc(R.provider) + ' via ESPN, so your bookie\'s will differ a little. Fair price takes the bookie margin out and blends in form and the matchup.</div>';
  }
  el.innerHTML = h;
  bindSegs(el, "ps", setPlaysSeg);
  const upd = (k, v) => { S.scrQ[k] = v; LS.set("scrQ", S.scrQ); S.scrOpen = null; loadScreener(false); };
  ["league", "prop", "side", "min_hit", "sort"].forEach(k => { const s = $("fq_" + k); if (s) s.onchange = () => upd(k, s.value); });
  ["price_min", "price_max"].forEach(k => { const s = $("fq_" + k); if (s) s.onchange = () => { const v = parseFloat(s.value); if (v >= 1) upd(k, v); }; });
  el.querySelectorAll("[data-fq]").forEach(b => b.onclick = () => upd(b.dataset.fq, S.scrQ[b.dataset.fq] === "1" ? "0" : "1"));
  const rows = R ? R.rows : [];
  el.querySelectorAll("[data-sr]").forEach(c => c.onclick = e => { if (e.target.closest("button")) return; const i = +c.dataset.sr; S.scrOpen = S.scrOpen === i ? null : i; renderLadder(); });
  el.querySelectorAll("[data-strack]").forEach(b => b.onclick = async () => {
    const r = rows[+b.dataset.strack]; b.disabled = true; b.textContent = "Adding...";
    try{ await api("/api/picks", pickBody(r, "screener")); await loadState(); toast({kind:"event", title:"Tracking " + r.name, body:r.label + " @ " + money(r.price)}); renderLadder(); }
    catch(e){ b.disabled = false; b.textContent = "Couldn't add: " + e.message; }
  });
  el.querySelectorAll("[data-spost2]").forEach(b => b.onclick = () => {
    const r = rows[+b.dataset.spost2], f = r.form || {};
    postDiscord({text:"📌 **" + r.name + "** " + r.label + " @ " + (+r.price).toFixed(2) + " (" + r.matchup + ")" + (f.l10n ? "\nHit " + f.l10 + " of the last " + f.l10n : "")}, b);
  });
  el.querySelectorAll("[data-sgame]").forEach(b => b.onclick = () => openGame(rows[+b.dataset.sgame].game_id));
  const rt = $("scretry"); if (rt) rt.onclick = () => loadScreener(true);
  const rf = $("scref"); if (rf) rf.onclick = () => loadScreener(true);
}

/* ---------- plays tab: props that landed in every game, by team ---------- */
async function loadPerfect(force){
  if (S.perfectLoading){ S.perfectAgain = true; return; }
  S.perfectLoading = true; S.perfectErr = "";
  if (S.tab === "ladder" && S.playsSeg === "perfect") renderLadder();
  try{ S.perfect = await api("/api/perfect?k=" + S.pfK + (force ? "&refresh=1" : "")); S.perfectAt = Date.now(); }
  catch(e){ S.perfectErr = e.message; }
  S.perfectLoading = false;
  if (S.perfectAgain){ S.perfectAgain = false; return loadPerfect(false); }
  if (S.tab === "ladder" && S.playsSeg === "perfect") renderLadder();
}
function faceHtml(name, league, id, color){
  const face = faceUrl(league, id, 128), st = tint(color);
  return '<span class="av' + (face ? " img" : "") + '"><span class="face"' + (st ? ' style="--tc:' + st + '"' : '') + '><span class="mono">' + esc(initials(name)) + '</span>' +
    (face ? '<img src="' + esc(face) + '" alt="" ' + NOIMG.replace("var p=this.parentNode;", "var p=this.parentNode.parentNode;") + '>' : '') + '</span></span>';
}
function pfRow(r, t, i){
  const tracked = legTracked(r), bits = ['<b class="pos">' + r.k + ' of ' + r.k + '</b>'];
  if (!r.yesno){
    bits.push('<span>' + (r.side === "more" ? "Lowest " + fmt(r.low) : "Highest " + fmt(r.high)) + '</span>');
    bits.push('<span>Avg ' + fmt(r.avg_k) + '</span>');
  }
  return '<div class="card pf" data-pfg="' + esc(r.game_id) + '">' + faceHtml(r.name, r.league, r.athlete_id, t.color) +
    '<div class="grow"><div class="l1">' + esc(r.name) + injBadge(r.injury) + '</div><div class="l2">' + esc(r.label) + '</div><div class="l3">' + bits.join("") + '</div></div>' +
    '<div class="pr"><span class="price">' + money(r.price) + '</span>' +
    (tracked ? '<span class="iconbtn on" aria-label="Tracking">&#10003;</span>' : '<button class="iconbtn" data-pft="' + i + '" aria-label="Track ' + esc(r.name) + '">+</button>') + '</div></div>';
}
function renderPerfect(el){
  const top = playsTop(), R = S.perfect;
  if ((!R || R.k !== S.pfK) && !S.perfectLoading && !S.perfectErr) loadPerfect(false);
  const opt = (v, l, cur) => '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? " selected" : "") + '>' + esc(l) + '</option>';
  const lgs = (R && R.leagues) || [];
  if (S.pfLeague && R && !lgs.some(l => l.key === S.pfLeague)) S.pfLeague = "";
  let h = top + '<div class="small muted" style="margin:-4px 2px 10px">Props that landed in every one of a player\'s last ' + S.pfK + ' games, team by team. Each player shows the hardest line that still came in every time.</div>' +
    '<div class="filters"><select id="pf_k">' + [5, 10, 15].map(k => opt(k, "Last " + k + " games", S.pfK)).join("") + '</select>' +
    '<select id="pf_lg">' + opt("", "All leagues", S.pfLeague) + lgs.map(l => opt(l.key, l.name, S.pfLeague)).join("") + '</select>' +
    '<select id="pf_min">' + [[0, "Any price"], [1.2, "$1.20 and up"], [1.4, "$1.40 and up"], [1.6, "$1.60 and up"], [2, "$2.00 and up"]].map(([v, l]) => opt(v, l, S.pfMin)).join("") + '</select></div>';
  const rows = [];
  if (!R || R.k !== S.pfK){
    h += S.perfectErr ? '<div class="empty"><b>Couldn\'t load props</b>' + esc(S.perfectErr) + '</div><button class="btn block" id="pfretry">Try again</button>'
      : '<div class="spin"></div><div class="empty" style="padding-top:0">Going through every prop and each player\'s recent games.<br>The first look can take up to a minute.</div>';
  } else {
    const teams = R.teams.filter(t => !S.pfLeague || t.league === S.pfLeague)
      .map(t => Object.assign({}, t, {rows:t.rows.filter(r => r.price >= S.pfMin - 1e-9)})).filter(t => t.rows.length);
    const n = teams.reduce((a, t) => a + t.rows.length, 0);
    h += '<div class="gamehead" style="margin-top:2px"><span class="small muted">' + n + (n === 1 ? " prop" : " props") + ' on ' + teams.length + (teams.length === 1 ? " team" : " teams") + ', checked ' + esc(clockText(R.updated)) + '</span><button class="btn small" id="pfref"' + (S.perfectLoading ? " disabled" : "") + '>' + (S.perfectLoading ? "Checking..." : "Refresh") + '</button></div>';
    if (!teams.length) h += '<div class="empty"><b>Nothing has landed every time</b>' + (S.pfMin ? "Try a lower price, or " : "Try ") + (S.pfK > 5 ? "a shorter run of games." : "again closer to game time, when more props are up.") + '</div>';
    teams.forEach(t => {
      const open = !!S.open["pf:" + t.key], show = open ? t.rows : t.rows.slice(0, 5);
      h += '<div class="thead">' + logoHtml(t.logo, t.color, t.abbr, false) + '<div class="grow"><div class="tn">' + esc(t.name) + '</div><div class="small muted">' + (t.home ? "v " : "at ") + esc(t.opp_name || t.opp) + ', ' + esc(startText(t.start)) + '</div></div><span class="badge lg">' + esc(t.league_short) + '</span></div>';
      h += '<div class="list">' + show.map(r => { rows.push(r); return pfRow(r, t, rows.length - 1); }).join("") + '</div>';
      if (t.rows.length > 5) h += '<button class="showall" data-pfo="' + esc(t.key) + '">' + (open ? "Show fewer" : "Show all " + t.rows.length) + '</button>';
    });
    h += '<div class="card small muted" style="margin-top:14px">Form is each player\'s last ' + S.pfK + ' games. Prices are ' + esc(R.provider) + ' via ESPN, so your bookie\'s will differ a little. Landing every time lately doesn\'t mean it will tonight, so check the minutes and the matchup.</div>';
  }
  el.innerHTML = h;
  bindSegs(el, "ps", setPlaysSeg);
  const kk = $("pf_k"); if (kk) kk.onchange = () => { S.pfK = +kk.value; LS.set("pfK", S.pfK); loadPerfect(false); renderLadder(); };
  const lg = $("pf_lg"); if (lg) lg.onchange = () => { S.pfLeague = lg.value; LS.set("pfLeague", S.pfLeague); renderLadder(); };
  const mn = $("pf_min"); if (mn) mn.onchange = () => { S.pfMin = +mn.value; LS.set("pfMin", S.pfMin); renderLadder(); };
  el.querySelectorAll("[data-pfo]").forEach(b => b.onclick = () => { S.open["pf:" + b.dataset.pfo] = !S.open["pf:" + b.dataset.pfo]; renderLadder(); });
  el.querySelectorAll("[data-pfg]").forEach(c => c.onclick = e => { if (e.target.closest("button")) return; openGame(c.dataset.pfg); });
  el.querySelectorAll("[data-pft]").forEach(b => b.onclick = async () => {
    const r = rows[+b.dataset.pft]; b.disabled = true; b.textContent = "...";
    try{ await api("/api/picks", pickBody(r, "perfect")); await loadState(); toast({kind:"event", title:"Tracking " + r.name, body:r.label + " @ " + money(r.price)}); renderLadder(); }
    catch(e){ b.disabled = false; b.textContent = "+"; toast({kind:"bust", title:"Couldn't add that", body:e.message}); }
  });
  const rt = $("pfretry"); if (rt) rt.onclick = () => loadPerfect(true);
  const rf = $("pfref"); if (rf) rf.onclick = () => loadPerfect(true);
}

function renderPickem(el){
  const top = playsTop(), q = S.pkQ, R = S.pk;
  if (!R && !S.pkLoading && !S.pkErr) loadPickem(false);
  const lgs = ((S.state && S.state.settings.leagues) || []).filter(k => k !== "nbl");
  let h = top + '<div class="fchips">' + [2, 3, 4, 5, 6].map(n => '<button data-pkn="' + n + '" class="' + (+q.n === n ? "on" : "") + '">' + n + ' picks</button>').join("") +
    '<button data-pks="1" class="' + (q.same === "1" ? "on" : "") + '">Same game is fine</button></div>';
  h += '<div class="filters"><select id="pk_league"><option value="">All leagues</option>' + lgs.map(k => '<option value="' + esc(k) + '"' + (q.league === k ? " selected" : "") + '>' + esc(leagueName(k)) + '</option>').join("") + '</select></div>';
  if (!R){
    h += S.pkErr ? '<div class="empty"><b>Couldn\'t build it</b>' + esc(S.pkErr) + '</div><button class="btn block" id="pkretry">Try again</button>'
      : '<div class="spin"></div><div class="empty" style="padding-top:0">Checking main lines and recent form.<br>The first look can take up to a minute.</div>';
  } else {
    if (R.picks.length){

        '<div class="chance">' + (R.chance != null ? pct(R.chance) : R.picks.length ? pct(R.picks.reduce((a, r) => a * (+r.p || 0), 1)) : "") + '<small>' + (R.picks.length === 1 ? "chance" : "all hit") + '</small></div></div>' + R.picks.map(pkRow).join("") +
        '<div class="row" style="gap:7px;margin-top:8px"><button class="btn small primary" id="pktrack"' + (R.picks.every(legTracked) ? " disabled" : "") + '>' + (R.picks.every(legTracked) ? "Tracking" : "Track all") + '</button>' + (HOOK() ? '<button class="btn small" id="pkpost">Post</button>' : '') + '<button class="btn small" id="pkref"' + (S.pkLoading ? " disabled" : "") + '>' + (S.pkLoading ? "Checking..." : "Refresh") + '</button></div></div>';
    }
    if (R.note) h += '<div class="small muted" style="margin:0 2px 10px">' + esc(R.note) + '</div>';
    if ((R.bench || []).length) h += '<h2>Next best</h2><div class="card play" style="padding-top:2px">' + R.bench.map(pkRow).join("").replace('class="leg"', 'class="leg" style="border-top:0"') + '</div>';
    h += '<div class="card small muted">Made for pick\'em apps like Dabble: More or Less on each player\'s main line, ranked by chance. Lines are ' + esc(R.provider || "DraftKings") + ' via ESPN, so check your app shows the same line before you lock it in.</div>';
  }
  el.innerHTML = h;
  bindSegs(el, "ps", setPlaysSeg);
  const upd = (k, v) => { S.pkQ[k] = v; LS.set("pkQ", S.pkQ); loadPickem(false); };
  el.querySelectorAll("[data-pkn]").forEach(b => b.onclick = () => upd("n", +b.dataset.pkn));
  el.querySelectorAll("[data-pks]").forEach(b => b.onclick = () => upd("same", S.pkQ.same === "1" ? "0" : "1"));
  const lg = $("pk_league"); if (lg) lg.onchange = () => upd("league", lg.value);
  const rt = $("pkretry"); if (rt) rt.onclick = () => loadPickem(true);
  const rf = $("pkref"); if (rf) rf.onclick = () => loadPickem(true);
  const pp = $("pkpost"); if (pp) pp.onclick = () => postDiscord({picks:R.picks, title:R.picks.length + "-pick entry"}, pp);
  const tk = $("pktrack");
  if (tk) tk.onclick = async () => {
    tk.disabled = true; tk.textContent = "Adding...";
    try{
      for (const r of R.picks) if (!legTracked(r)) await api("/api/picks", pickBody(r, "pickem"));
      await loadState(); toast({kind:"event", title:"Tracking your " + R.picks.length + " picks", body:"You'll get alerts as they move"}); renderLadder();
    }catch(e){ tk.disabled = false; tk.textContent = "Couldn't add: " + e.message; }
  };
}

/* ---------- plays tab: the tips from every game, a multi built from them, and how they went ---------- */
const SPORT_NAME = sp => (S.state && S.state.sports && S.state.sports[sp]) || sp;
const KIND_NAME = {call:"The calls", best:"Best bets", value:"Value picks", sgm:"Same game multis"};
const fopt = (v, l, cur) => '<option value="' + esc(v) + '"' + (String(cur) === String(v) ? " selected" : "") + '>' + esc(l) + '</option>';
function feedHere(){ return S.tab === "ladder" && (S.playsSeg === "tips" || S.playsSeg === "multi"); }
function feedSig(){ const F = S.feed; return F ? [F.building, F.done, F.total, (F.tips || []).length, F.at].join(":") : "e:" + S.feedErr; }
async function loadFeed(force){
  if (S.feedLoading) return;
  S.feedLoading = true;
  try{ S.feed = await api("/api/tips?hours=36" + (force ? "&refresh=1" : "")); S.feedErr = ""; S.feedAt = Date.now(); }
  catch(e){ S.feedErr = e.message; }
  S.feedLoading = false;
  clearTimeout(S.feedTimer);
  if (S.feed && S.feed.building) S.feedTimer = setTimeout(() => { if (feedHere()) loadFeed(false); }, 2500);
  if (!feedHere()) return;
  if (S.playsSeg === "multi" && S.feed && !S.feed.building){ S.multi = null; loadMulti(); return; }
  // while the games are being read, only redraw when there's something new to show
  if (feedSig() !== S.feedDrawn && !busyTyping()) renderLadder();
}
function busyTyping(){ const a = document.activeElement; return !!(a && /INPUT|SELECT/.test(a.tagName)); }
function feedPick(t){
  return {athlete_id:t.athlete_id, name:t.name, team:t.team, league:t.league, sport:t.sport,
    game:{home:t.home_abbr, away:t.away_abbr, home_logo:t.home_logo, away_logo:t.away_logo, home_color:t.home_color, away_color:t.away_color,
          home_name:t.home_name, away_name:t.away_name, sport:t.sport}};
}
// One row per bet: the same bet can be a best bet and a call, so keep the first by kind.
function feedList(){
  const F = S.feed, q = S.feedQ;
  if (!F) return [];
  const rank = {best:0, call:1, value:2}, seen = {}, out = [];
  (F.tips || []).slice().sort((a, b) => (rank[a.kind_tip] || 0) - (rank[b.kind_tip] || 0)).forEach(t => {
    const k = [t.game_id, t.athlete_id, t.stat, t.side, t.line].join("|");
    if (seen[k]) return;
    seen[k] = 1;
    if ((!q.sport || t.sport === q.sport) && (!q.kind || t.kind_tip === q.kind)) out.push(t);
  });
  const edge = t => t.price ? t.p * t.price - 1 : -9;
  // best picks: the chance, nudged by the value at the price (capped, so a long shot's big edge can't run away with it)
  const pick = t => t.p + 0.5 * (t.price ? Math.max(-0.15, Math.min(0.25, t.p * t.price - 1)) : -0.03);
  if (q.sort === "value") out.sort((a, b) => edge(b) - edge(a) || b.p - a.p);
  else if (q.sort === "soon") out.sort((a, b) => String(a.start).localeCompare(String(b.start)) || pick(b) - pick(a));
  else if (q.sort === "chance") out.sort((a, b) => b.p - a.p || edge(b) - edge(a));
  else out.sort((a, b) => pick(b) - pick(a));
  const floor = +q.min || 0, per = {};
  return out.filter(t => {
    if ((t.price || t.fair || 0) < floor - 1e-9) return false;
    per[t.game_id] = (per[t.game_id] || 0) + 1;
    return per[t.game_id] <= 3;
  });
}
function feedSports(){
  const out = [];
  ((S.feed && S.feed.tips) || []).forEach(t => { if (t.sport && !out.includes(t.sport)) out.push(t.sport); });
  return out;
}
function feedGame(t){ return (t.away_abbr || t.away_name) + " @ " + (t.home_abbr || t.home_name) + " · " + startText(t.start) + " · " + t.league_short; }
function feedRow(t){
  const k = "fd" + Object.keys(S.tipMap).length;
  S.tipMap[k] = t;
  const done = legTracked(t), hi = t.p >= 0.6;
  const lab = t.title && t.label.indexOf(t.title + ": ") === 0 ? t.label.slice(t.title.length + 2) : t.label;
  const own = t.athlete_id === "match" || lab.indexOf(t.name) === 0;
  const tag = t.kind_tip === "call" ? t.title : t.kind_tip === "value" ? "Value at the price" : "";
  const why = t.why || t.note || "";
  return '<div class="tip" data-ftip="' + k + '">' + avatarHtml(feedPick(t)) + '<div class="grow">' + (tag ? '<div class="tk">' + esc(tag) + '</div>' : '') +
    '<div class="t1">' + (own ? esc(lab) : esc(t.name) + injBadge(t.injury)) + '</div>' + (own ? '' : '<div class="t2">' + esc(lab) + '</div>') +
    '<div class="t3">' + esc(feedGame(t)) + '</div>' + (why ? '<div class="t3">' + esc(why) + '</div>' : '') + '</div>' +
    '<div class="r"><div class="pc' + (hi ? " hi" : "") + '">' + pct(t.p) + '</div><div class="pr">' + tipPrice(t) + '</div></div>' +
    '<button class="iconbtn add' + (done ? " on" : "") + '" data-fadd="' + k + '" aria-label="' + (done ? "Tracking" : "Track this") + '">' + (done ? "&#10003;" : "+") + '</button></div>';
}
function pricesNote(){
  const s = (S.state && S.state.settings) || {};
  return s.odds_api_key || s.propline_key ? "Each price is the best one found across the bookies, and the chance takes their margin out."
    : "Prices are DraftKings and Bet365 via ESPN, so your bookie's will differ a little. Add a free key under Settings, Prices to compare the Aussie bookies.";
}
function readingHtml(F, what){
  return '<div class="feedhead"><span class="small muted">' + esc(what) + F.done + ' of ' + F.total + (F.total === 1 ? " game" : " games") + '</span></div>' +
    '<div class="readbar"><i style="width:' + (F.total ? Math.max(4, Math.round(F.done / F.total * 100)) : 4) + '%"></i></div>';
}
function renderFeed(el){
  const top = playsTop(), F = S.feed, q = S.feedQ;
  if (!S.feedLoading && !S.feedErr && (!F || (!F.building && Date.now() - (S.feedAt || 0) > 10 * 60e3))) loadFeed(false);
  if (!S.score && !S.scoreLoading && !S.scoreErr) loadScore();
  S.tipMap = {};
  S.feedDrawn = feedSig();
  let h = top;
  if (!F){
    el.innerHTML = h + (S.feedErr ? '<div class="empty"><b>Couldn\'t read the games</b>' + esc(S.feedErr) + '</div><button class="btn block" id="fdretry">Try again</button>'
      : '<div class="spin"></div><div class="empty" style="padding-top:0">Reading every game in the next day and a half.<br>The first look takes a minute or two.</div>');
    bindSegs(el, "ps", setPlaysSeg);
    const rt = $("fdretry"); if (rt) rt.onclick = () => { S.feedErr = ""; loadFeed(true); renderLadder(); };
    return;
  }
  const sports = feedSports();
  if (q.sport && !sports.includes(q.sport) && !F.building) q.sport = "";
  if (sports.length > 1) h += '<div class="fchips"><button data-fs="" class="' + (!q.sport ? "on" : "") + '">All sports</button>' +
    sports.map(sp => '<button data-fs="' + esc(sp) + '" class="' + (q.sport === sp ? "on" : "") + '">' + esc(SPORT_NAME(sp)) + '</button>').join("") + '</div>';
  h += '<div class="filters"><select id="fd_sort">' + fopt("picks", "Best picks", q.sort) + fopt("chance", "Best chance", q.sort) + fopt("value", "Best value", q.sort) + fopt("soon", "Starting soonest", q.sort) + '</select>' +
    '<select id="fd_min" aria-label="Lowest price">' + [[0, "Any price"], [1.3, "$1.30+"], [1.5, "$1.50+"], [2, "$2.00+"]].map(([v, l]) => fopt(v, l, +q.min)).join("") + '</select>' +
    '<select id="fd_kind">' + fopt("", "All tips", q.kind) + fopt("best", "Best bets", q.kind) + fopt("call", "The calls", q.kind) + fopt("value", "Value picks", q.kind) + '</select></div>';
  h += recordCard();
  if (F.building) h += readingHtml(F, "Reading games: ");
  else h += '<div class="feedhead"><span class="small muted">' + (F.total ? F.total + (F.total === 1 ? " game" : " games") + " in the next 36 hours" : "No games in the next 36 hours") + (F.at ? ", checked " + esc(clockText(F.at)) : "") + '</span>' +
    '<button class="btn small" id="fdref"' + (S.feedLoading ? " disabled" : "") + '>Refresh</button></div>';
  const all = feedList(), show = all.slice(0, S.feedShow);
  if (show.length) h += '<div class="list">' + show.map(feedRow).join("") + '</div>';
  if (all.length > show.length) h += '<button class="showall" id="fdmore">Show ' + Math.min(30, all.length - show.length) + ' more</button>';
  if (!all.length && !F.building) h += '<div class="empty"><b>' + (F.total ? "Nothing stands out yet" : "No games coming up") + '</b>' +
    (F.total ? (q.sport || q.kind || q.min ? "Try all sports, any price, or every kind of tip." : "More prices go up closer to game time, so check back later.") : "Turn on more leagues in Settings, or check back later.") + '</div>';
  if (all.length) h += '<div class="card small muted" style="margin-top:12px">Up to three tips a game here. Tap one to see the rest of that game. ' + esc(pricesNote()) + ' Chances are estimates, not promises.</div>';
  el.innerHTML = h;
  bindSegs(el, "ps", setPlaysSeg);
  const save = () => { LS.set("feedQ", S.feedQ); S.feedShow = 30; renderLadder(); };
  el.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => { S.feedQ.sport = b.dataset.fs; save(); });
  const so = $("fd_sort"); if (so) so.onchange = () => { S.feedQ.sort = so.value; save(); };
  const ki = $("fd_kind"); if (ki) ki.onchange = () => { S.feedQ.kind = ki.value; save(); };
  const mi = $("fd_min"); if (mi) mi.onchange = () => { S.feedQ.min = +mi.value; save(); };
  const mo = $("fdmore"); if (mo) mo.onclick = () => { S.feedShow += 30; renderLadder(); };
  const rf = $("fdref"); if (rf) rf.onclick = () => { rf.disabled = true; loadFeed(true); };
  const rc = $("fdrec"); if (rc) rc.onclick = openRecord;
  el.querySelectorAll("[data-ftip]").forEach(r => r.onclick = e => {
    if (e.target.closest("button")) return;
    const t = S.tipMap[r.dataset.ftip];
    if (t){ S.gview = "tips"; openGame(t.game_id); }
  });
  el.querySelectorAll("[data-fadd]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const t = S.tipMap[b.dataset.fadd];
    if (legTracked(t)) { setTab("picks"); return; }
    const pk = await trackTip(t, b);
    if (!pk) return;
    await loadState();
    toast({kind:"event", title:"Tracking it", body:tipText(t) + (t.price ? " @ " + money(t.price) : "")});
    renderLadder();
  });
}

/* the multi builder: one leg a game, picked for the best chance at the price you want */
async function loadMulti(){
  if (S.multiLoading){ S.multiAgain = true; return; }
  S.multiLoading = true; S.multiErr = "";
  const q = S.mQ, want = JSON.stringify(q);
  if (S.tab === "ladder" && S.playsSeg === "multi") renderLadder();
  try{ S.multi = await api("/api/multi?legs=" + q.legs + "&target=" + q.target + (q.sport ? "&sport=" + encodeURIComponent(q.sport) : "")); S.multiFor = want; S.multiAt = Date.now(); }
  catch(e){ S.multiErr = e.message; }
  S.multiLoading = false;
  if (S.multiAgain){ S.multiAgain = false; return loadMulti(); }
  if (S.tab === "ladder" && S.playsSeg === "multi") renderLadder();
}
function multiLeg(l){
  const own = l.athlete_id === "match" || l.label.indexOf(l.name) === 0;
  return '<div class="leg"><div class="l1"><span>' + (own ? esc(l.label) : esc(l.name) + (l.team ? ' <span class="muted small">' + esc(l.team) + '</span>' : '') + injBadge(l.injury)) + '</span>' +
    '<span class="price">' + (l.price ? money(l.price) : 'fair ' + money(l.fair)) + '</span></div>' +
    (own ? '' : '<div class="l2">' + esc(l.label) + '</div>') +
    '<div class="l3">' + esc(feedGame(l)) + (l.book && l.price ? ' · ' + esc(l.book) : '') + '</div>' +
    '<div class="why">' + pct(l.p) + ' chance' + (l.why ? ' · ' + esc(l.why) : '') + '</div></div>';
}
function multiText(M){
  return "🎯 **" + M.legs.length + "-leg multi @ $" + (+M.price).toFixed(2) + "** (" + pct(M.p) + " chance all land)\n" +
    M.legs.map(l => "• " + (l.athlete_id === "match" || l.label.indexOf(l.name) === 0 ? "" : "**" + l.name + "** ") + l.label +
      (l.price ? " @ $" + (+l.price).toFixed(2) + (l.book ? " " + l.book : "") : "") + " (" + (l.away_abbr || l.away_name) + " @ " + (l.home_abbr || l.home_name) + ")").join("\n") +
    "\n_Chances are estimates, not locks. Bet what you can afford._";
}
function renderMulti(el){
  const top = playsTop(), q = S.mQ, F = S.feed, M = S.multi;
  if (!S.feedLoading && !S.feedErr && (!F || (!F.building && Date.now() - (S.feedAt || 0) > 10 * 60e3))) loadFeed(false);
  else if (F && !F.building && !S.multiLoading && !S.multiErr && (!M || S.multiFor !== JSON.stringify(q))) loadMulti();
  S.feedDrawn = feedSig();
  let h = top + '<div class="small muted" style="margin:-4px 2px 10px">Each leg comes from a different game, so one result doesn\'t drag the others down. The legs are the likeliest mix that gets to your price.</div>';
  h += '<div class="fchips">' + [2, 3, 4, 5, 6].map(n => '<button data-ml="' + n + '" class="' + (+q.legs === n ? "on" : "") + '">' + n + ' legs</button>').join("") + '</div>';
  const sports = feedSports();
  h += '<div class="filters"><span class="row small muted" style="gap:6px">Price at least $<input id="m_target" type="number" step="0.5" min="1.5" max="100" inputmode="decimal" value="' + (+q.target).toFixed(2) + '"></span>' +
    (sports.length > 1 || q.sport ? '<select id="m_sport">' + fopt("", "All sports", q.sport) + sports.map(sp => fopt(sp, SPORT_NAME(sp), q.sport)).join("") + '</select>' : '') + '</div>';
  if (!F || F.building){
    h += F ? readingHtml(F, "Reading the games first: ") : S.feedErr ? '<div class="empty"><b>Couldn\'t read the games</b>' + esc(S.feedErr) + '</div><button class="btn block" id="mretry">Try again</button>' : '<div class="spin"></div>';
  } else if (!M || S.multiFor !== JSON.stringify(q)){
    h += S.multiErr ? '<div class="empty"><b>Couldn\'t build it</b>' + esc(S.multiErr) + '</div><button class="btn block" id="mretry">Try again</button>' : '<div class="spin"></div>';
  } else if (M.none){
    h += '<div class="empty"><b>No multi to show</b>' + esc(M.none) + '</div>';
  } else {
    const done = M.legs.every(legTracked), fair = M.legs.some(l => !l.price);
    h += '<div class="card play"><div class="top"><div><span class="badge best">' + M.legs.length + '-leg multi</span><div class="kind">At <span class="price" style="color:var(--text)">' + money(M.price) + '</span> · fair ' + money(M.fair) + '</div></div>' +
      '<div class="chance">' + pct(M.p) + '<small>all land</small></div></div>' + M.legs.map(multiLeg).join("") +
      '<div class="row" style="gap:7px;margin-top:8px;flex-wrap:wrap"><button class="btn small' + (done ? '' : ' primary') + '" id="mtrack"' + (done ? " disabled" : "") + '>' + (done ? "Tracking all legs" : "Track all " + M.legs.length + " legs") + '</button>' +
      (HOOK() ? '<button class="btn small" id="mpost">Post</button>' : '') + '<button class="btn small" id="mref">Read the games again</button></div></div>';
    h += '<div class="small muted" style="margin:0 2px 12px">' + (fair ? "A leg without a price is counted at its fair price. " : "The price is the legs multiplied. ") + 'Bookies sometimes pay a little less on multis, so go by the price on your slip.</div>';
  }
  h += '<div class="card small muted">' + esc(pricesNote()) + '</div>';
  el.innerHTML = h;
  bindSegs(el, "ps", setPlaysSeg);
  const upd = (k, v) => { S.mQ[k] = v; LS.set("mQ", S.mQ); S.multi = null; S.multiErr = ""; if (S.feed && !S.feed.building) loadMulti(); else renderLadder(); };
  el.querySelectorAll("[data-ml]").forEach(b => b.onclick = () => upd("legs", +b.dataset.ml));
  const tg = $("m_target"); if (tg) tg.onchange = () => { const v = parseFloat(tg.value); if (v >= 1.5 && v <= 100) upd("target", Math.round(v * 100) / 100); else tg.value = (+S.mQ.target).toFixed(2); };
  const sp = $("m_sport"); if (sp) sp.onchange = () => upd("sport", sp.value);
  const rt = $("mretry"); if (rt) rt.onclick = () => { S.feedErr = ""; S.multiErr = ""; if (!S.feed || S.feed.building) loadFeed(true); else loadMulti(); renderLadder(); };
  const rf = $("mref"); if (rf) rf.onclick = () => { S.multi = null; loadFeed(true); renderLadder(); };
  const mp = $("mpost"); if (mp) mp.onclick = () => postDiscord({text:multiText(M)}, mp);
  const mt = $("mtrack");
  if (mt) mt.onclick = async () => {
    mt.disabled = true; mt.textContent = "Adding...";
    const ids = [];
    for (const l of M.legs){
      const have = S.state && S.state.picks.find(p => !p.final && p.game_id === l.game_id && p.athlete_id === l.athlete_id && p.stat === l.stat && p.side === l.side && Math.abs((+p.line || 0) - (+l.line || 0)) < 1e-6);
      if (have){ ids.push(have.id); continue; }
      const pk = await trackTip(l, null);
      if (pk) ids.push(pk.id);
    }
    await loadState();
    renderLadder();
    if (FEAT().slips && ids.length === M.legs.length) openSlipSheet(ids, null);
    else toast({kind:"event", title:"Tracking the multi", body:ids.length + " legs added"});
  };
}

/* the record: every tip saved before its game and marked after, so you can see if the chances hold up */
async function loadScore(){
  if (S.scoreLoading) return;
  S.scoreLoading = true;
  try{ S.score = await api("/api/scorecard?days=" + S.scoreQ.days + "&sport=" + encodeURIComponent(S.scoreQ.sport || "all")); S.scoreErr = ""; }
  catch(e){ S.scoreErr = e.message; }
  S.scoreLoading = false;
  if (S.sheet && S.sheet.record) renderRecord();
  else if (S.tab === "ladder" && S.playsSeg === "tips" && !busyTyping()) renderLadder();
}
function scoreTotal(R){
  return (R.kinds || []).filter(k => k.key !== "sgm").reduce((a, k) => ({n:a.n + k.n, won:a.won + k.won, priced:a.priced + k.priced, units:a.units + k.units}), {n:0, won:0, priced:0, units:0});
}
function recordCard(){
  const R = S.score;
  if (!R || !R.ok) return "";
  const t = scoreTotal(R);
  if (!t.n && !R.pending) return "";
  const one = S.scoreQ.sport && S.scoreQ.sport !== "all";
  return '<div class="card record" id="fdrec" role="button" tabindex="0"><div class="grow"><div class="small muted">' + esc(one ? SPORT_NAME(S.scoreQ.sport) + " tips" : "How the tips went") + ', last ' + R.days + ' days</div>' +
    (t.n ? '<div class="rline"><span class="big2">' + t.won + ' of ' + t.n + '</span><span class="small muted">landed, ' + pct(t.won / t.n) + '</span></div>' + (R.pending ? '<div class="small muted">' + R.pending + ' more waiting on results</div>' : '')
         : '<div style="font-weight:650;margin-top:3px">The first results come in as games finish</div><div class="small muted">' + R.pending + (R.pending === 1 ? " tip" : " tips") + ' waiting on results</div>') +
    '</div><span class="chev" aria-hidden="true">&rsaquo;</span></div>';
}
function openRecord(){
  S.sheet = {record:true};
  renderRecord();
  openSheetPanel();
  loadScore();
}
function unitsText(u){ return (u >= 0 ? "+" : "") + (+u).toFixed(2); }

/* this week's spending, and the limit if you set one */
function weekCard(){
  const W = S.state && S.state.weekly;
  if (!W || !FEAT().weekly) return "";
  const lim = +W.limit || 0, last = W.last || {};
  if (!W.bets && !last.bets && !lim) return "";
  let h = '<div class="card week"><div class="row" style="align-items:flex-start"><div class="grow"><div class="small muted">This week</div><span class="big2">' + money(W.staked) + '</span>' +
    '<div class="small muted">on ' + W.bets + (W.bets === 1 ? " bet" : " bets") + (W.open ? ", " + W.open + " still open" : "") + '</div></div>' +
    (W.bets > W.open ? '<div style="text-align:right"><div class="small muted">Profit so far</div><span class="big2 ' + (W.profit >= 0 ? "pos" : "neg") + '">' + smoney(W.profit) + '</span><div class="small muted">' + money(W.returned) + ' back</div></div>'
      : '<div class="small muted" style="text-align:right;max-width:120px">Nothing settled yet</div>') + '</div>';
  if (lim){
    const used = W.staked / lim, over = W.staked > lim + 1e-9;
    h += '<div class="prog"><i style="width:' + Math.min(100, Math.round(used * 100)) + '%;background:' + (over ? "var(--red)" : used >= 0.8 ? "var(--amber)" : "var(--green)") + '"></i></div>' +
      '<div class="small ' + (over ? "neg" : "muted") + '">' + (over ? "Over your " + money(lim) + " weekly limit by " + money(W.staked - lim) : money(W.left) + " left of your " + money(lim) + " weekly limit") + '</div>';
  }
  if (last.bets) h += '<div class="small muted" style="margin-top:8px">Last week: ' + money(last.staked) + ' on ' + last.bets + (last.bets === 1 ? " bet" : " bets") + ', ' + smoney(last.profit) + '</div>';
  return h + '</div>';
}
// How far a new stake would go past the weekly limit (0 or less means it fits).
function overLimit(stake, slip){
  const W = S.state && S.state.weekly, lim = W ? +W.limit || 0 : 0;
  if (!lim) return 0;
  const mine = slip && (!slip.created || slip.created >= (W.week_start || 0)) ? +slip.stake || 0 : 0;
  return (+W.staked || 0) - mine + stake - lim;
}

/* ---------- pick sheet extras ---------- */
function teammates(x){
  if (!S.game || x.p.isMatch) return [];
  const t = S.game.teams.find(tm => tm.players.some(p => p.id === x.p.id));
  if (!t) return [];
  const L = (gameLines() || {}).players || {};
  // Teammates ruled out tonight come first: "without him" matters most when he's missing.
  const weight = p => (/^out/i.test(p.inj || "") ? 100000 : 0) + ((p.stats && +p.stats.MIN) || 0) * 100 + (L[p.id] ? Object.keys(L[p.id]).length : 0) + (p.starter ? 50 : 0);
  return t.players.filter(p => p.id !== x.p.id && !p.dnp).sort((a, b) => weight(b) - weight(a) || a.name.localeCompare(b.name)).slice(0, 14);
}

function formFilters(x, f){

    (mates.length ? '<button data-ff="without" class="' + (x.ff === "without" ? "on" : "") + '">Without a teammate</button>' : '') + '</div>';

  return h;
}
function marketNote(m, pr){
  if (!m || !FEAT().screener) return "";
  const bits = [];
  if (!pr.yesno && m.over && m.under){
    const po = 1 / m.over, pu = 1 / m.under;
    bits.push("Fair price " + money((po + pu) / po) + " over, " + money((po + pu) / pu) + " under, with the margin out");

  return bits.length ? '<div class="small muted" style="margin-top:2px">' + esc(bits.join(" · ")) + '</div>' : "";
}

const SIMD_TEST = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]);
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load the screenshot reader")); document.head.appendChild(s); });
}
async function blobUrl(url, type){
  const r = await fetch(url);
  if (!r.ok) throw new Error("Couldn't load the screenshot reader");
  return URL.createObjectURL(new Blob([await r.arrayBuffer()], {type}));
}
function ocrWorker(){
  clearTimeout(OCR.idle);
  if (OCR.worker) return Promise.resolve(OCR.worker);
  if (!OCR.loading) OCR.loading = (async () => {
    if (!window.Tesseract) await loadScript("ocr/tesseract.min.js");
    let simd = false;
    try { simd = WebAssembly.validate(SIMD_TEST); } catch(e){}
    const workerPath = await blobUrl("ocr/worker.min.js", "application/javascript");
    const corePath = (await blobUrl("ocr/" + (simd ? "tesseract-core-simd-lstm.wasm.js" : "tesseract-core-lstm.wasm.js"), "application/javascript")) + "#core.js";
    const r = await fetch("ocr/eng.traineddata.gz");
    if (!r.ok) throw new Error("Couldn't load the screenshot reader");
    const data = new Uint8Array(await r.arrayBuffer());
    const w = await Tesseract.createWorker([{code:"eng", data}], 1, {workerPath, corePath, workerBlobURL:false, cacheMethod:"none", logger: m => { if (OCR.log) OCR.log(m); }});
    await w.setParameters({tessedit_pageseg_mode:"4", preserve_interword_spaces:"1"});
    OCR.worker = w;
    return w;
  })().catch(e => { OCR.loading = null; throw e; });
  return OCR.loading;
}
function ocrIdle(){
  clearTimeout(OCR.idle);
  OCR.idle = setTimeout(async () => { const w = OCR.worker; OCR.worker = null; OCR.loading = null; if (w) { try { await w.terminate(); } catch(e){} } }, 3 * 60e3);
}
/** Grey, upright contrast, and dark mode flipped to dark-on-light, which reads best. */
async function prepImage(blob){
  const bmp = await createImageBitmap(blob);
  let scale = bmp.width < 1000 ? Math.min(2, 1300 / bmp.width) : bmp.width > 2000 ? 2000 / bmp.width : 1;
  if (bmp.width * bmp.height * scale * scale > 16e6) scale = Math.sqrt(16e6 / (bmp.width * bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
  const x = c.getContext("2d", {willReadFrequently:true});
  x.imageSmoothingQuality = "high";
  x.drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  const im = x.getImageData(0, 0, c.width, c.height), d = im.data;
  let sum = 0;
  for (let i = 0; i < d.length; i += 4){ const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = d[i + 1] = d[i + 2] = g; sum += g; }
  if (sum / (d.length / 4) < 115) for (let i = 0; i < d.length; i += 4){ d[i] = d[i + 1] = d[i + 2] = 255 - d[i]; }
  x.putImageData(im, 0, 0);
  return c;
}

window.appScan = function(urls){

  if (S.state) go();

async function scanImages(srcs){
  if (!S.sheet || !S.sheet.scan) openScan(true);
  const job = S.scan = {phase:"reading", total:srcs.length, done:0, pct:0, lines:[], loadingReader:!OCR.worker};
  renderScan();
  const alive = () => S.scan === job && S.sheet && S.sheet.scan;
  try{
    OCR.log = m => { if (!alive()) return; if (m.status === "recognizing text"){ job.loadingReader = false; job.pct = m.progress || 0; scanProgress(); } };
    const w = await ocrWorker();
    job.loadingReader = false;
    for (let i = 0; i < srcs.length; i++){
      if (!alive()) return;
      job.done = i; job.pct = 0; scanProgress();
      const blob = typeof srcs[i] === "string" ? await (await fetch(srcs[i])).blob() : srcs[i];
      const r = await w.recognize(await prepImage(blob));
      if (i) job.lines.push("---");
      r.data.text.split("\n").forEach(l => job.lines.push(l));
    }
    ocrIdle();
    if (!alive()) return;
    job.phase = "matching"; renderScan();
    const res = await api("/api/scan", {lines:job.lines});
    if (!alive()) return;
    job.res = res;
    job.legs = res.legs.map(l => Object.assign({}, l, {on: !l.tracked && !!l.stat && l.line != null}));
    job.stake = res.stake != null ? res.stake : "";
    job.price = res.price != null ? res.price : (res.legs.length && res.legs.every(l => l.odds) ? +res.legs.reduce((a, l) => a * l.odds, 1).toFixed(2) : "");
    job.slip = res.stake != null || res.legs.length > 1;
    job.phase = "review";
    renderScan();
  }catch(e){
    if (!alive()) return;
    job.phase = "error"; job.err = e.message || String(e); renderScan();
  }
}
function scanProgress(){
  const j = S.scan, bar = $("scanbar"), txt = $("scantxt");
  if (!j || !bar || !txt) return;
  const whole = (j.done + (j.pct || 0)) / Math.max(1, j.total);
  bar.style.width = Math.round(whole * 100) + "%";
  txt.textContent = j.loadingReader ? "Getting the reader ready..." : "Reading " + (j.total > 1 ? "screenshot " + (j.done + 1) + " of " + j.total : "your screenshot") + " · " + Math.round((j.pct || 0) * 100) + "%";
}

function barColour(hex){
  if (!/^[0-9a-f]{6}$/i.test(hex || "")) return null;
  const c = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16));
  const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  const k = lum < 0.18 ? 0.45 : 0;
  return c.map(v => Math.round(v + (255 - v) * k));
}

function bindTips(w, g){
  const rt = $("tipretry"); if (rt) rt.onclick = () => loadTips(g.id, true);

    const pk = await trackTip(t, b);

  });

      const have = S.state && S.state.picks.find(p => !p.final && p.game_id === l.game_id && p.athlete_id === l.athlete_id && p.stat === l.stat && p.side === l.side && Math.abs((+p.line || 0) - (+l.line || 0)) < 1e-6);
      if (have) { ids.push(have.id); continue; }
      const pk = await trackTip(l, null);
      if (pk) ids.push(pk.id);
    }
    await loadState();
    rerenderGame();
    if (FEAT().slips && ids.length === s.legs.length) openSlipSheet(ids, null);

  });
  w.querySelectorAll("[data-cs]").forEach(b => b.onclick = () => {

    rerenderGame();
  });
  w.querySelectorAll("[data-chk]").forEach(b => b.onclick = async () => {
    const d = (S.tips[g.id] || {}).data, t = checkerTip(b.dataset.chk, d, g);
    if (legTracked(t)) { toast({kind:"event", title:"Already tracking that", body:t.label}); return; }
    const pk = await trackTip(t, b);
    if (!pk) return;
    await loadState();
    toast({kind:"event", title:"Tracking it", body:t.label + ", fair " + money(1 / Math.max(0.01, t.p))});
    rerenderGame();
  });
}

/* ---------- betting lines ---------- */
function gameLines(){ return (S.game && S.game.lines) || null; }
function marketFor(eid, stat){
  const L = gameLines(); if (!L) return null;
  const m = eid === "match" ? L.match : (L.players || {})[eid];
  return m && m[stat] ? m[stat] : null;
}
function priceAt(m, line, side){
  if (!m || line == null || isNaN(line)) return null;
  if (m.line != null && Math.abs(m.line - line) < 1e-6){ const p = side === "more" ? m.over : m.under; if (p) return p; }
  const hit = ((side === "more" ? m.alts : m.alts_under) || []).find(a => Math.abs(a[0] - line) < 1e-6);
  return hit ? hit[1] : null;
}
function matchHint(pr){
  const m = marketFor("match", pr.key);
  if (!m) return esc(pr.name);
  if (m.yes && m.over) return money(m.over);
  if (m.line != null) return fmt(m.line) + (m.over ? " · " + money(m.over) : "");
  return esc(pr.name);
}
function matchLineRow(g){
  const L = gameLines(); if (!L) return "";
  const m = L.match || {}, bits = [];
  if (m.HWIN && m.HWIN.over) bits.push('<b>' + esc(g.home.abbr) + '</b> ' + money(m.HWIN.over));
  if (L.draw) bits.push('<b>Draw</b> ' + money(L.draw));
  if (m.AWIN && m.AWIN.over) bits.push('<b>' + esc(g.away.abbr) + '</b> ' + money(m.AWIN.over));
  if (m.TOTAL && m.TOTAL.line != null) bits.push('<b>Total</b> ' + fmt(m.TOTAL.line));
  if (!bits.length) return "";
  return '<div class="lines" style="justify-content:center">' + bits.map(b => '<span>' + b + '</span>').join("") + '<span>' + esc(L.provider || "") + '</span></div>';
}
const SUMMARY_KEYS = {basketball:["PTS","REB","AST","3PM"], football:["PASS_YDS","RUSH_YDS","REC_YDS","REC","ATD"], soccer:["G","SOT","SH"], aussie:["D","G","M","T"], league:["TRY","MR","TK"]};
function lineSummary(eid, sport){
  const L = gameLines(), pm = L && L.players && L.players[eid];
  if (!pm) return "";
  const bits = [], props = (S.game.props && S.game.props.player) || [];
  (SUMMARY_KEYS[sport] || []).forEach(k => {
    const m = pm[k]; if (!m) return;
    const pr = props.find(q => q.key === k), short = pr ? pr.short : k;
    if (m.yes && m.over) bits.push(short + " " + money(m.over));
    else if (m.line != null) bits.push(fmt(m.line) + " " + short.toLowerCase());
    else if ((m.alts || []).length) bits.push(Math.ceil(m.alts[0][0]) + "+ " + short + " " + money(m.alts[0][1]));
  });
  return bits.slice(0, 4).join(" · ");
}
function lineChips(m, pr){
  const out = [];
  if (!m) return out;
  if (pr.yesno){ if (m.over) out.push({line:0.5, side:"more", price:m.over, label:"Yes"}); return out; }
  if ((pr.key === "HCAP" || pr.key === "ACAP") && m.line != null && S.game){
    const g = S.game.game, gm = {home_name:g.home.short || g.home.name, away_name:g.away.short || g.away.name};
    ["more", "less"].forEach(sd => { const pz = sd === "more" ? m.over : m.under; if (pz) out.push({line:m.line, side:sd, price:pz, main:true, label:capText({stat:pr.key, side:sd, line:m.line, sport:g.sport, game:gm})}); });
    return out;
  }
  const twoWay = (m.alts_under || []).length > 0;
  if (m.line != null){
    if (m.over) out.push({line:m.line, side:"more", price:m.over, label:"Over " + fmt(m.line), main:true});
    if (m.under) out.push({line:m.line, side:"less", price:m.under, label:"Under " + fmt(m.line), main:true});
  }
  const alts = [];
  (m.alts || []).forEach(a => { if (m.line != null && Math.abs(a[0] - m.line) < 1e-6 && m.over) return; alts.push({line:a[0], side:"more", price:a[1], label: twoWay ? "Over " + fmt(a[0]) : Math.ceil(a[0]) + "+"}); });
  (m.alts_under || []).forEach(a => { if (m.line != null && Math.abs(a[0] - m.line) < 1e-6 && m.under) return; alts.push({line:a[0], side:"less", price:a[1], label:"Under " + fmt(a[0])}); });
  alts.filter(c => c.price >= 1.01 && c.price <= 6).sort((a, b) => a.line - b.line || (a.side === "more" ? -1 : 1)).slice(0, 10).forEach(c => out.push(c));
  return out;
}

/* ---------- player form ---------- */
async function loadForm(p, g, wo){
  const key = g.id + "|" + p.id + (wo ? "|" + wo : "");
  if (S.forms[key] && !S.forms[key].error) { updateFormBox(); return; }
  S.forms[key] = {loading:true};
  updateFormBox();
  try { S.forms[key] = await api("/api/player?game=" + encodeURIComponent(g.id) + "&id=" + encodeURIComponent(p.id) + (wo ? "&without=" + encodeURIComponent(wo) : "")); }
  catch(e){ S.forms[key] = {error:e.message}; }
  updateFormBox();
}
function updateFormBox(){
  const x = S.sheet, fb = $("formbox");
  if (!x || !fb) return;
  const pr = x.list.find(q => q.key === x.stat) || {};
  fb.innerHTML = formInner(x, pr);
}
function formInner(x, pr){
  const base = S.forms[x.g.id + "|" + x.p.id];
  if (!base || base.loading) return '<div class="small muted">Loading recent games...</div>';
  if (base.error || !base.games || !base.games.length) return '<div class="small muted">No recent games to go on.</div>';
  let top = formFilters(x, base);
  if (base.injury && FEAT().screener) top = '<div class="small" style="color:var(--amber);margin-bottom:6px">' + esc(base.injury + (base.injury_note ? ": " + base.injury_note : "")) + '</div>' + top;
  const ff = x.ff || "all";
  let games = base.games, tag = "";
  if (ff === "home"){ games = games.filter(gm => gm.at === "v"); tag = " at home"; }
  else if (ff === "away"){ games = games.filter(gm => gm.at === "@"); tag = " away"; }
  else if (ff === "opp"){ games = games.filter(gm => gm.opp === base.opp); tag = " v " + base.opp; }
  else if (ff === "without"){
    if (!x.wo) return top + '<div class="small muted">Pick the teammate to leave out.</div>';
    const fw = S.forms[formKey(x)];
    if (!fw || fw.loading) return top + '<div class="small muted">Checking which games they missed...</div>';
    if (fw.error || !fw.games) return top + '<div class="small muted">Couldn\'t check that teammate.</div>';
    games = fw.games.filter(gm => gm.tm === false);
    if (!games.length) return top + '<div class="small muted">' + esc(fw.without_name || "They") + ' played in all of the last ' + fw.games.length + ' games, so there\'s nothing to compare yet.</div>';
    tag = " without " + String(fw.without_name || "them").split(" ").slice(-1)[0];
  }
  const mu = FEAT().screener && base.matchup && base.matchup[pr.key] ? '<div class="mu">' + esc(base.matchup[pr.key].text) + '</div>' : '';
  const vals = games.map(gm => gm.v[pr.key]).filter(v => v != null);
  if (!vals.length) return top + '<div class="small muted">' + (ff === "all" ? "No recent numbers for this stat." : "None of the last " + base.games.length + " games fit that.") + '</div>' + mu;
  const line = parseFloat(x.line), more = x.side === "more", hasLine = !isNaN(line);
  const hit = v => more ? v > line : v < line;
  const n10 = Math.min(10, vals.length), n5 = Math.min(5, vals.length);
  const last10 = vals.slice(0, n10), last5 = vals.slice(0, n5);
  const avg = a => a.reduce((t, v) => t + v, 0) / a.length;
  let head;
  if (!hasLine) head = "Averaging " + fmt(+avg(last10).toFixed(1)) + " over the last " + n10 + tag;
  else if (pr.yesno) head = (more ? "Happened in " : "Didn't happen in ") + last10.filter(hit).length + " of the last " + n10 + tag;
  else head = "Hit in " + last10.filter(hit).length + " of the last " + n10 + tag + " · last 5: " + last5.filter(hit).length + "/" + n5;
  const sub = pr.yesno ? "" : "Avg " + fmt(+avg(last5).toFixed(1)) + " last 5 · " + fmt(+avg(last10).toFixed(1)) + " last 10";
  return top + '<div class="big">' + head + '</div>' + (sub ? '<div class="small muted">' + sub + '</div>' : '') + spark(last10.slice().reverse(), hasLine ? line : NaN, more) +
    '<div class="small muted" style="display:flex;justify-content:space-between"><span>' + n10 + ' games ago</span><span>Last game</span></div>' + mu;
}
function spark(vals, line, more){
  const W = 300, H = 54, n = vals.length;
  if (!n) return "";
  const max = Math.max(1, ...vals, isNaN(line) ? 0 : line + 1);
  const bw = W / n, gap = Math.min(6, bw * 0.25);
  let s = '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
  vals.forEach((v, i) => {
    const h = Math.max(2, v / max * (H - 4));
    const col = isNaN(line) ? "#5ca8ff" : (more ? v > line : v < line) ? "#2fe08a" : "#33456b";
    s += '<rect x="' + (i * bw + gap / 2).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + (bw - gap).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + col + '"/>';
  });
  if (!isNaN(line)){ const y = H - line / max * (H - 4); s += '<line x1="0" x2="' + W + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#eef3fa" stroke-width="1.5" stroke-dasharray="5 4"/>'; }
  return s + '</svg>';
}

    if (m.line != null) x.line = String(m.line);

      let best = m.alts[0];
      m.alts.forEach(a => { if (Math.abs(Math.log(a[1] / 1.9)) < Math.abs(Math.log(best[1] / 1.9))) best = a; });
      x.line = String(best[0]); x.side = "more";

  $("sheetin").querySelectorAll("[data-lc]").forEach(b => b.onclick = () => { const c = x.chips[+b.dataset.lc]; x.line = String(c.line); x.side = c.side; x.odds = c.price; renderSheet(); });
  $("sheetin").querySelectorAll("[data-stat]").forEach(b => b.onclick = () => { setStat(b.dataset.stat); renderSheet(); });
  $("sheetin").querySelectorAll("[data-side]").forEach(b => b.onclick = () => { x.side = b.dataset.side; x.odds = x.market ? priceAt(x.market, pr.yesno ? 0.5 : parseFloat(x.line), x.side) : null; renderSheet(); });
  $("sheetin").querySelectorAll("[data-al]").forEach(b => b.onclick = () => { x.alerts = b.dataset.al; renderSheet(); });
  $("scancel").onclick = closeSheet;
  $("sadd").onclick = async () => {
    const raw = pr.yesno ? "0.5" : (inp ? inp.value.trim() : "");
    if (raw !== "" && (isNaN(parseFloat(raw)) || parseFloat(raw) < 0)) { $("sheeterr").textContent = "That line doesn't look right."; return; }
    $("sadd").disabled = true;
    try{
      await api("/api/picks", {game_id:g.id, athlete_id:p.id, name:p.name, short:p.short, team:p.team, stat:x.stat, side:x.side, alerts:x.alerts, line: raw === "" ? null : parseFloat(raw), odds: x.odds || null});
      LS.set("last-" + (g.sport || "basketball") + (p.isMatch ? "-m" : ""), {stat:x.stat, side:x.side});
      closeSheet(); await loadState(); renderGame();
      const what = (pr.yesno ? pr.name + ": " + (x.side === "more" ? "Yes" : "No") : (raw === "" ? pr.name : (x.side === "more" ? "More " : "Less ") + raw + " " + pr.name)) + (x.odds ? " @ " + money(x.odds) : "");
      toast({kind:"event", title:"Tracking " + (p.isMatch ? "the match" : p.name), body:what});
    }catch(e){ $("sheeterr").textContent = e.message; $("sadd").disabled = false; }
  };
}

function addLabel(x){ return "Add pick" + (x && x.odds ? " · " + money(x.odds) : ""); }
// Keep the line or handicap buttons in step with the line as it's typed.
function renderSheetSides(){
  const x = S.sheet; if (!x) return;
  const g = x.g, gm = {home_name:g.home.short || g.home.name, away_name:g.away.short || g.away.name};
  $("sheetin").querySelectorAll("[data-side]").forEach(b => { b.textContent = capText({stat:x.stat, side:b.dataset.side, line:parseFloat(x.line) || 0, sport:g.sport, game:gm}); });
}

/* ---------- loops ---------- */
loadState(); loadGames();
setInterval(loadState, 3000);
setInterval(() => { if (S.tab === "games" && !S.gameId && document.activeElement !== $("gsearch")) loadGames(); }, 20000);
setInterval(() => { if (S.gameId && !S.sheet && document.activeElement !== $("psearch")) refreshGame(); }, 10000);
setInterval(() => { if (S.state) setFeed(S.state.feed); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ loadState(); if (S.tab === "games") loadGames(); } });
</script>
<div id="othertab" style="display:none;position:fixed;inset:0;z-index:90;background:#0c1424;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:340px"><div style="font-weight:700;font-size:18px;margin-bottom:8px">ClutchUp is open in another tab</div><div style="color:#8d9ab2;font-size:15px">Use that one, or close it and this tab takes over.</div></div></div>
<script>
(function(){
  function start(){
    var s = document.createElement("script");
    s.src = "engine.js?v=4.4";
    s.onload = function(){ try { window.main([]); } catch (e) { window.__engineFailed(); } };
    s.onerror = function(){ window.__engineFailed(); };
    document.body.appendChild(s);
  }
  // One copy of the engine at a time, so two tabs don't save over each other's picks.
  var forever = function(){ return new Promise(function(){}); };
  if (navigator.locks && navigator.locks.request) {
    navigator.locks.request("proptracker-engine", {ifAvailable: true}, function(lock){
      if (lock) { start(); return forever(); }
      document.getElementById("othertab").style.display = "flex";
      navigator.locks.request("proptracker-engine", function(){ document.getElementById("othertab").style.display = "none"; start(); return forever(); });
    });
  } else start();
})();
</script>
